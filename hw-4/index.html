<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задания на работу с кодом — часть 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1 class="header__title">Задания на работу с кодом</h1>
      <p class="header__subtitle">Нажмите на любую кнопку, чтобы запустить код. Результат выводится в консоль — откройте её клавишей F12.</p>
    </header>

    <div class="tasks-grid">
      <button class="tasks-btn" onclick="runTask1()">Задание 1 <span>Меньшее из двух чисел</span></button>
      <button class="tasks-btn" onclick="runTask2()">Задание 2 <span>Чётное или нечётное</span></button>
      <button class="tasks-btn" onclick="runTask3()">Задание 3 <span>Квадрат числа</span></button>
      <button class="tasks-btn" onclick="runTask4()">Задание 4 <span>Возраст пользователя</span></button>
      <button class="tasks-btn" onclick="runTask5()">Задание 5 <span>Произведение чисел</span></button>
      <button class="tasks-btn" onclick="runTask6()">Задание 6 <span>Число в кубе</span></button>
      <button class="tasks-btn" onclick="runTask7()">Задание 7 <span>Площадь и периметр круга</span></button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
