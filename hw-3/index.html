<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задания на работу с кодом — часть 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1 class="header__title">Задания на работу с кодом</h1>

    </header>

    <div class="tasks-grid">
      <button class="tasks-btn" onclick="runTask1()">Задание 1 <span>«Привет» дважды</span></button>
      <button class="tasks-btn" onclick="runTask2()">Задание 2 <span>Числа 1–5</span></button>

      <button class="tasks-btn" onclick="runTask4()">Задание 4 <span>Зарплаты (for-in)</span></button>
      <button class="tasks-btn" onclick="runTask5()">Задание 5 <span>Деление на 2</span></button>
      <button class="tasks-btn" onclick="runTask6()">Задание 6 <span>Пятницы месяца</span></button>
    </div>
  </main>
  <script src="script.js"></script>

</html>
