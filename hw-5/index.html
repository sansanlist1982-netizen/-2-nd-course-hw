<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практическая работа: Массивы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1 class="header__title">Задания на работу с массивами</h1>
      <p class="header__subtitle">Нажмите на любую кнопку, чтобы запустить выполнение JavaScript-кода. Результаты большинства заданий выводятся в консоль браузера (F12 → Console).</p>
    </header>

    <div class="tasks-grid">
      <button class="tasks-btn" onclick="runTask1()">Задание 1 <span>Вывод до числа 10</span></button>
      <button class="tasks-btn" onclick="runTask2()">Задание 2 <span>Индекс значения 4</span></button>
      <button class="tasks-btn" onclick="runTask3()">Задание 3 <span>join через пробел</span></button>
      <button class="tasks-btn" onclick="runTask4()">Задание 4 <span>Многомерный массив</span></button>
      <button class="tasks-btn" onclick="runTask5()">Задание 5 <span>Добавить 2, 2, 2</span></button>
      <button class="tasks-btn" onclick="runTask6()">Задание 6 <span>Сортировка и удаление 'a'</span></button>
      <button class="tasks-btn" onclick="runTask7()">Задание 7 <span>Угадай число</span></button>
      <button class="tasks-btn" onclick="runTask8()">Задание 8 <span>Строка задом наперёд</span></button>
      <button class="tasks-btn" onclick="runTask9()">Задание 9 <span>Двумерный в одномерный</span></button>
      <button class="tasks-btn" onclick="runTask10()">Задание 10 <span>Суммы соседних элементов</span></button>
      <button class="tasks-btn" onclick="runTask11()">Задание 11 <span>Массив квадратов</span></button>
      <button class="tasks-btn" onclick="runTask12()">Задание 12 <span>Длины слов</span></button>
      <button class="tasks-btn" onclick="runTask13()">Задание 13 <span>Только отрицательные</span></button>
      <button class="tasks-btn" onclick="runTask14()">Задание 14 <span>Чётные из случайных</span></button>
      <button class="tasks-btn" onclick="runTask15()">Задание 15 <span>Среднее арифметическое</span></button>
    </div>
  </main>
  <script src="hw-5.js"></script>
</body>
</html>
